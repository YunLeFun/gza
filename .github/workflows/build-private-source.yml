# SPDX-License-Identifier: Apache-2.0
name: Build GZA
run-name: Build source ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Trusted, committed dayun-kicker revision (full 40-character SHA)
        required: true
        type: string
      build_docs:
        description: Also typecheck and build the documentation
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: private-source-build
  cancel-in-progress: true

jobs:
  web:
    # Only maintainers can dispatch the canonical repository's main workflow.
    if: ${{ github.repository == 'YunLeFun/gza' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      source_sha: ${{ inputs.source_sha }}
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Validate requested revision and credential
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PRIVATE_SOURCE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::source_sha must be a full 40-character commit SHA.'
            exit 1
          fi
          if [[ -z "$PRIVATE_SOURCE_TOKEN" ]]; then
            echo '::error::Configure PRIVATE_SOURCE_TOKEN with read-only access to dayun-kicker.'
            exit 1
          fi

      - name: Checkout private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YunLeFun/dayun-kicker
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Check source revision and Git asset policy
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          if [[ "${actual_sha,,}" != "${SOURCE_SHA,,}" ]]; then
            echo '::error::The checked-out source revision does not match the requested SHA.'
            exit 1
          fi
          node scripts/check-git-assets.mjs

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable the source repository's pinned pnpm version
        run: |
          corepack enable
          corepack install

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore and verify pinned media
        run: pnpm assets:pull --runtime-only

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        # Full-map physics tests share CPU with other workers on hosted runners.
        # Keep the source timeouts and assertions intact while avoiding contention.
        run: pnpm test --maxWorkers=1

      - name: Build web application
        run: pnpm build

      - name: Verify release and performance budgets
        run: |
          pnpm verify:release
          pnpm verify:performance

      - name: Checkout public documentation
        if: ${{ inputs.build_docs }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YunLeFun/gza
          ref: ${{ github.sha }}
          path: public-docs
          persist-credentials: false

      - name: Typecheck and build public documentation
        if: ${{ inputs.build_docs }}
        working-directory: public-docs
        run: |
          corepack install
          pnpm install --frozen-lockfile
          pnpm docs:typecheck
          pnpm docs:build

  browser:
    name: Browser E2E (${{ matrix.shard }}/4)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Checkout verified private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YunLeFun/dayun-kicker
          ref: ${{ needs.web.outputs.source_sha }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable the source repository's pinned pnpm version
        run: |
          corepack enable
          corepack install

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore and verify pinned media
        run: pnpm assets:pull --runtime-only

      - name: Install Chromium and browser dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        env:
          E2E_SHARD: ${{ matrix.shard }}
        run: pnpm test:e2e --shard="${E2E_SHARD}/4"
